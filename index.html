<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dff3ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="今天吃什么">
  <meta name="description" content="一个轻巧、离线可用的个人吃饭轮盘。">
  <title>小语今天吃什么</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand-copy">
        <p>今日份好好吃饭</p>
        <h1 id="workspaceName">小语今天吃什么</h1>
      </div>
      <div class="topbar-actions">
        <button id="appearanceButton" class="icon-button" type="button" aria-label="外观设置" title="外观设置">
          <i data-lucide="settings-2" aria-hidden="true"></i>
        </button>
        <button id="manageButton" class="icon-button" type="button" aria-label="管理候选" title="管理候选">
          <i data-lucide="list-plus" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <section class="wheel-stage" aria-label="吃饭轮盘">
      <div id="wheelFrame" class="wheel-frame">
        <div class="wheel-shadow" aria-hidden="true"></div>
        <div class="wheel-pointer" aria-hidden="true"></div>
        <div id="wheel" class="wheel" aria-label="食物和饭店候选轮盘"></div>
        <div id="wheelEmpty" class="wheel-empty" hidden>
          <i data-lucide="utensils" aria-hidden="true"></i>
          <strong>先加两个候选</strong>
        </div>
        <div class="wheel-center" aria-hidden="true"><span></span></div>
      </div>

      <div class="action-bar">
        <button id="spinButton" class="spin-button" type="button">
          <i data-lucide="rotate-cw" aria-hidden="true"></i>
          <span>开始转</span>
        </button>
        <button id="candidateButton" class="candidate-button" type="button">
          <i data-lucide="utensils" aria-hidden="true"></i>
          <span><b id="candidateCount">0</b> 个候选</span>
        </button>
      </div>
    </section>
  </main>

  <dialog id="manageDialog" class="sheet-dialog">
    <section class="sheet-content" aria-labelledby="manageTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <div>
          <p>我的候选</p>
          <h2 id="manageTitle">今天想吃的</h2>
        </div>
        <button id="closeManageButton" class="icon-button" type="button" aria-label="关闭">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>

      <form id="addForm" class="add-form" autocomplete="off">
        <label class="sr-only" for="entryInput">食物或饭店名</label>
        <input id="entryInput" name="entry" type="text" maxlength="24" placeholder="食物或饭店名" enterkeyhint="done" required>
        <button id="addButton" type="submit" aria-label="添加候选" title="添加候选">
          <i data-lucide="plus" aria-hidden="true"></i>
        </button>
      </form>

      <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      <ul id="entryList" class="entry-list" aria-label="候选列表"></ul>
      <div id="toast" class="toast" role="status" aria-live="polite">
        <span id="toastMessage"></span>
        <button id="undoButton" type="button" hidden>撤销</button>
      </div>
    </section>
  </dialog>

  <dialog id="appearanceDialog" class="sheet-dialog appearance-dialog">
    <section class="sheet-content appearance-content" aria-labelledby="appearanceTitle">
      <div class="sheet-handle" aria-hidden="true"></div>
      <header class="sheet-header">
        <div>
          <p>我的轮盘</p>
          <h2 id="appearanceTitle">外观设置</h2>
        </div>
        <button id="closeAppearanceButton" class="icon-button" type="button" aria-label="关闭">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>
      <form id="appearanceForm" class="appearance-form">
        <label class="appearance-field" for="appearanceName"><span>轮盘名称</span><input id="appearanceName" type="text" maxlength="24" autocomplete="off" required></label>
        <div class="appearance-field">
          <span>背景图</span>
          <div class="background-picker"><label for="backgroundFile" class="file-button"><i data-lucide="image-plus" aria-hidden="true"></i><span>选择图片</span></label><span id="backgroundFileName" class="background-file-name">使用默认背景</span></div>
          <input id="backgroundFile" type="file" accept="image/jpeg,image/png,image/webp,image/heic,image/heif" hidden>
        </div>
        <p id="appearanceMessage" class="appearance-message" role="status" aria-live="polite"></p>
        <div class="appearance-actions"><button id="resetNameButton" type="button">恢复默认名称</button><button id="resetBackgroundButton" type="button">恢复默认背景</button><button class="save-appearance-button" type="submit">保存外观</button></div>
      </form>
    </section>
  </dialog>

  <dialog id="resultDialog" class="result-dialog">
    <section class="result-content" aria-labelledby="resultTitle">
      <button id="closeResultButton" class="icon-button result-close" type="button" aria-label="关闭">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
      <div class="result-icon" aria-hidden="true"><i data-lucide="sparkles"></i></div>
      <p>今天就吃</p>
      <h2 id="resultTitle"></h2>
      <button id="spinAgainButton" class="spin-again-button" type="button">
        <i data-lucide="rotate-cw" aria-hidden="true"></i>
        <span>再转一次</span>
      </button>
    </section>
  </dialog>

  <script src="vendor/lucide.min.js"></script>
  <script src="vendor/spin-wheel-iife.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
